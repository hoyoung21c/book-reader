<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원서 낭독기</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f4f1ea;--sf:#fbf9f4;--ink:#23201b;--mu:#7a7568;--ln:#e3ded2;--ac:#2e5b4e;--on:#fbf9f4;--am:#c98a1b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12110f;--sf:#1b1a17;--ink:#efeae0;--mu:#8f897b;--ln:#2b2924;--ac:#8fc4a8;--on:#0e1a15;--am:#e0ad4a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12110f;--sf:#1b1a17;--ink:#efeae0;--mu:#8f897b;--ln:#2b2924;--ac:#8fc4a8;--on:#0e1a15;--am:#e0ad4a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
.eyebrow{font:600 11px/1 "Newsreader",Georgia,serif;letter-spacing:.22em;color:var(--mu)}
h1{margin:6px 0 16px;font-size:26px;line-height:1.2;letter-spacing:-.03em;font-weight:700}
.vf{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;border:1px solid var(--ln)}
video{width:100%;height:100%;object-fit:contain;display:block}
.c{position:absolute;width:22px;height:22px;border:2px solid rgba(255,255,255,.8);pointer-events:none}
.tl{top:12px;left:12px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.tr{top:12px;right:12px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.bl{bottom:12px;left:12px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.br{bottom:12px;right:12px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.badge{position:absolute;left:14px;top:14px;margin:14px 0 0 14px;display:flex;align-items:center;gap:8px;padding:5px 11px 5px 9px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font:600 13px/1 "Newsreader",Georgia,serif;letter-spacing:.04em;backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:#8a8a85}
.dot.on{background:#bdbdb6}
.dot.sc{background:var(--am);animation:pu 1s ease-in-out infinite}
.dot.rd{background:var(--ac);animation:pu 1.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.35;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none!important}}
#st{margin:18px 2px 2px;font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.35}
#mv{margin:0 2px;min-height:22px;color:var(--mu);font-size:14px}
.actions{display:flex;gap:10px;margin:14px 0 18px}
button{font:inherit;font-weight:650;border:0;border-radius:14px;padding:15px 18px;background:var(--ac);color:var(--on);letter-spacing:-.01em;transition:transform .12s,opacity .12s}
button:active{transform:scale(.98)}
#go{flex:1}
button.sub{background:transparent;color:var(--ink);border:1px solid var(--ln)}
button:disabled{opacity:.4}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.row label{flex:0 0 64px;color:var(--mu);font-size:14px}
select{flex:1;min-width:0;appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;text-align:right;text-align-last:right;padding:2px 0}
input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}
output{flex:0 0 46px;text-align:right;font:600 14px "Newsreader",Georgia,serif;color:var(--mu)}
details{margin-top:16px}
summary{color:var(--mu);font-size:14px;padding:6px 2px}
#tx{margin-top:6px;padding:14px 16px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;max-height:34vh;overflow:auto;white-space:pre-wrap;font:17px/1.65 "Newsreader",Georgia,serif}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">BOOK READER</div><h1>원서 낭독기</h1></header>
<section class="vf">
<video id="v" playsinline muted></video>
<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
<div class="badge" style="margin:0"><span id="dot" class="dot"></span><span id="pg">—</span></div>
</section>
<div id="st">시작 버튼을 누르세요</div>
<div id="mv"></div>
<div class="actions"><button id="go">시작</button><button id="again" class="sub" disabled>처음부터 다시</button></div>
<section class="card">
<div class="row"><label for="area">인식 영역</label><select id="area"><option value="A">화면 전체 (한 페이지)</option><option value="L">왼쪽 절반</option><option value="R">오른쪽 절반</option></select></div>
<div class="row"><label for="cam">카메라</label><select id="cam"><option>시작하면 표시돼요</option></select></div>
<div class="row" id="zrow" style="display:none"><label for="zoom">확대</label><input id="zoom" type="range"></div>
<div class="row"><label for="rate">속도</label><input id="rate" type="range" min="0.7" max="1.3" step="0.05" value="0.95"><output id="rv">0.95×</output></div>
<div class="row"><label for="voice">목소리</label><select id="voice"></select></div>
</section>
<details><summary>인식된 텍스트</summary><div id="tx"></div></details>
</main>
<canvas id="cv" hidden></canvas><canvas id="sm" width="48" height="36" hidden></canvas>
<script>
const $=id=>document.getElementById(id);
const video=$('v'),cv=$('cv'),sm=$('sm'),st=$('st'),mv=$('mv'),tx=$('tx');
const MOVE=7, SIM=0.5, MINWORDS=10, OCRW=1500;
let stream,worker,wake,running=false,busy=false,gen=0,pageNo=0,pageWords=null,lastParas=[];
let prev=null,still=0,locked=false,fails=0,lastTry=0;

// --- 목소리 ---
function loadVoices(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));
  const sel=$('voice'),cur=sel.value;
  sel.innerHTML=vs.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('')||'<option value="">기본 음성</option>';
  const pref=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google|natural|neural/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0];
  sel.value=cur||(pref&&pref.voiceURI)||'';
}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
const curVoice=()=>speechSynthesis.getVoices().find(v=>v.voiceURI===$('voice').value);

// --- 읽기 (페이지가 바뀌면 gen이 올라가 이전 낭독은 즉시 폐기) ---
function speak(paras){
  const my=++gen;speechSynthesis.cancel();
  const chunks=[];
  for(const p of paras){let cur='';
    for(const s of p.split(/(?<=[.!?…]["”’']?)\s+/)){
      if(cur&&(cur+' '+s).length>220){chunks.push(cur);cur=s}else cur=cur?cur+' '+s:s}
    if(cur)chunks.push(cur)}
  let i=0;
  const next=()=>{
    if(my!==gen)return;
    if(i>=chunks.length){st.textContent=`페이지 ${pageNo} 읽기 완료 · 다음 장을 넘겨주세요`;return}
    st.textContent=`페이지 ${pageNo} 읽는 중 (${i+1}/${chunks.length})`;
    const u=new SpeechSynthesisUtterance(chunks[i++]);
    const v=curVoice();u.lang=v?v.lang:'en-US';if(v)u.voice=v;
    u.rate=parseFloat($('rate').value);
    u.onend=next;
    u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')next()};
    speechSynthesis.speak(u)};
  setTimeout(next,150);
}

// --- 텍스트 정리·비교 ---
const clean=t=>t.replace(/-\s*\n\s*/g,'').replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ').trim();
const alpha=t=>(t.match(/[A-Za-z ,.'"!?;:-]/g)||[]).length/(t.length||1);
const wordSet=t=>new Set(t.toLowerCase().match(/[a-z]{4,}/g)||[]);
function sim(a,b){let n=0;for(const w of a)if(b.has(w))n++;return n/Math.min(a.size,b.size)}

// --- 움직임 감지 (손·책장이 움직이는 동안은 OCR을 건너뜀) ---
function motion(){
  const c=sm.getContext('2d',{willReadFrequently:true});
  c.drawImage(video,0,0,48,36);
  const d=c.getImageData(0,0,48,36).data,g=new Float32Array(48*36);
  for(let i=0;i<g.length;i++)g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  let s=0;if(prev){for(let i=0;i<g.length;i++)s+=Math.abs(g[i]-prev[i]);s/=g.length}
  prev=g;return s;
}

async function readFrame(){
  const vw=video.videoWidth,vh=video.videoHeight,m=$('area').value;
  let sx=0,sw=vw;if(m==='L')sw=vw/2;if(m==='R'){sx=vw/2;sw=vw/2}
  const k=Math.min(1,OCRW/sw);cv.width=Math.round(sw*k);cv.height=Math.round(vh*k);
  const c=cv.getContext('2d');c.filter='grayscale(1) contrast(1.3)';
  c.drawImage(video,sx,0,sw,vh,0,0,cv.width,cv.height);
  mv.textContent='글자 인식 중…';
  const {data}=await worker.recognize(cv);
  let paras=data.paragraphs
    ?data.paragraphs.filter(p=>p.confidence>=60).map(p=>clean(p.text))
    :data.text.split(/\n\s*\n/).map(clean);
  paras=paras.filter(t=>t.split(' ').length>=3&&alpha(t)>0.7);
  const words=wordSet(paras.join(' '));
  if(words.size<MINWORDS){
    fails++;if(fails>=3)locked=true;else locked=false;
    mv.textContent='글자를 충분히 찾지 못했어요 (조명·각도·거리를 확인하세요)';return}
  fails=0;
  if(pageWords&&sim(words,pageWords)>=SIM){mv.textContent='같은 페이지 (그대로 읽는 중)';return}
  pageWords=words;pageNo++;lastParas=paras;tx.textContent=paras.join('\n\n');
  $('again').disabled=false;mv.textContent='';speak(paras);
}

async function tick(){
  if(!running)return;
  if(video.readyState>=2&&!busy){
    const diff=motion();
    if(diff>MOVE){still=0;locked=false;fails=0;mv.textContent='움직임 감지…'}else still++;
    if(still>=2&&!locked&&Date.now()-lastTry>1500){
      locked=true;busy=true;
      try{await readFrame()}catch(e){console.error(e);mv.textContent='인식 오류: '+(e.message||e)}
      busy=false;lastTry=Date.now();
    }
  }
  setTimeout(tick,400);
}

// --- 카메라 선택·확대 ---
async function openCam(id){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const v={width:{ideal:1920},height:{ideal:1080}};
  if(id)v.deviceId={exact:id};else v.facingMode={ideal:'environment'};
  stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});
  video.srcObject=stream;await video.play();
  prev=null;still=0;locked=false;fails=0;
  setupZoom();
}
async function listCams(){
  const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const cur=stream.getVideoTracks()[0].getSettings().deviceId;
  $('cam').innerHTML=ds.map((d,i)=>`<option value="${d.deviceId}">${d.label||'카메라 '+(i+1)}</option>`).join('');
  $('cam').value=cur;
}
function setupZoom(){
  const t=stream.getVideoTracks()[0],c=t.getCapabilities?t.getCapabilities():{},z=$('zoom');
  if(c.zoom){z.min=c.zoom.min;z.max=c.zoom.max;z.step=c.zoom.step||0.1;z.value=t.getSettings().zoom||c.zoom.min;$('zrow').style.display='flex'}
  else $('zrow').style.display='none';
}
$('cam').onchange=async()=>{if(!running)return;try{await openCam($('cam').value)}catch(e){st.textContent='카메라 전환 실패: '+(e.message||e)}};
$('zoom').oninput=()=>{const t=stream&&stream.getVideoTracks()[0];if(t)t.applyConstraints({advanced:[{zoom:parseFloat($('zoom').value)}]}).catch(()=>{})};

async function start(){
  speechSynthesis.speak(new SpeechSynthesisUtterance('')); // 사용자 터치 시점에 음성 허용
  $('go').disabled=true;st.textContent='카메라와 인식 엔진 준비 중… (처음엔 1~2분 걸릴 수 있어요)';
  try{
    await openCam();await listCams();
    
    if(!worker)worker=await Tesseract.createWorker('eng',1,{langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int'});
    try{wake=await navigator.wakeLock.request('screen')}catch(e){}
    running=true;pageNo=0;pageWords=null;prev=null;still=0;locked=false;fails=0;lastTry=0;
    $('go').textContent='정지';st.textContent='책을 비춰주세요';tick();
  }catch(e){
    st.textContent='시작 실패: '+(e.message||e)+' (HTTPS 주소인지, 카메라 권한을 허용했는지 확인하세요)';
    if(stream)stream.getTracks().forEach(t=>t.stop());
  }
  $('go').disabled=false;
}
function stop(){
  running=false;gen++;speechSynthesis.cancel();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(wake){wake.release().catch(()=>{});wake=null}
  $('go').textContent='시작';st.textContent='정지됨';mv.textContent='';
}
$('go').onclick=()=>running?stop():start();
$('again').onclick=()=>{if(lastParas.length)speak(lastParas)};
document.addEventListener('visibilitychange',async()=>{
  if(running&&document.visibilityState==='visible'){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});

// --- 상태 표시(점·페이지 배지·속도 값) ---
const dot=$('dot');
function paint(){const a=st.textContent,b=mv.textContent;
  dot.className='dot '+(/읽는 중/.test(a)?'rd':/인식 중|움직임/.test(b)?'sc':running?'on':'');
  $('pg').textContent=pageNo?'P.'+pageNo:'—'}
new MutationObserver(paint).observe(st,{childList:true});
new MutationObserver(paint).observe(mv,{childList:true});
$('rate').addEventListener('input',()=>{$('rv').textContent=parseFloat($('rate').value).toFixed(2)+'×'});
$('voice').addEventListener('change',()=>{if(running)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('This is how I will read your book.');const v=curVoice();if(v){u.voice=v;u.lang=v.lang}u.rate=parseFloat($('rate').value);speechSynthesis.speak(u)});
</script>
</body>
</html>
